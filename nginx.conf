# Nginx equivalent of .htaccess. Include inside your server {} block, e.g.:
#   include /path/to/website/nginx.conf;
# Adjust root and fastcgi_pass for your environment.
# Security headers (CSP, HSTS, ...) are sent from src/security.php, so they are not repeated here.

# root /var/www/website/public;   # the web root is the public/ folder
index index.php;
server_tokens off;

# Redirect plain HTTP to HTTPS (production). Uncomment once a certificate is installed:
# if ($scheme = http) { return 301 https://$host$request_uri; }

# Redirect external requests for *.php to extensionless (301).
# $request_uri is the original URI, so internal rewrites don't loop.
if ($request_uri ~* "^/(.+?)\.php(\?.*)?$") {
    return 301 /$1$is_args$args;
}

# Never serve env files or other dotfiles.
location ~ /\.(?!well-known) {
    deny all;
}

# Docs and config are not public (src/ lives outside this web root).
location ~* \.(env|example|md|conf|log|sql|bak|ini)$ { deny all; }
location ~ ^/(LICENSE|README.*)$ { deny all; }

# robots.txt and sitemap.xml are generated from BASE_URL.
location = /robots.txt  { rewrite ^ /robots.php last; }
location = /sitemap.xml { rewrite ^ /sitemap.php last; }

# Route extensionless requests to PHP files internally; anything else gets the 404 page.
location / {
    try_files $uri $uri/ $uri.php?$query_string /404.php;
}

# Run PHP files via PHP-FPM.
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;   # or 127.0.0.1:9000
}

# Static assets are cache-busted with ?v=ASSET_VERSION, so cache them for a long time.
location ~* \.(css|js|png|jpe?g|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

gzip on;
gzip_types text/css application/javascript application/json application/xml image/svg+xml;
