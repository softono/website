# Nginx equivalent of public/.htaccess. Include inside your server {} block, e.g.:
#   include /path/to/website/nginx.conf;
# Set root to the public/ folder and adjust fastcgi_pass for your environment.

# root /var/www/website/public;
index index.php;

# Security headers.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Real files are served as-is; everything else goes to the front controller,
# which handles routing, redirects, sitemap.xml, robots.txt and real 404s (src/router.php).
location / {
    try_files $uri /index.php?$query_string;
}

# Long-lived caching for versioned static assets (?v=ASSET_VERSION).
location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 1y;
    try_files $uri =404;
}

# Only the front controller runs as PHP.
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;   # or 127.0.0.1:9000
}
location ~ \.php$ {
    return 404;
}

# Never serve env files or other dotfiles.
location ~ /\.(?!well-known) {
    deny all;
}
